# MCP arm: the catalog answered live by @tmorrow/cre8-mcp over stdio.
# The version is pinned so a run is reproducible; it must match the version the
# oracle fixtures were built from (oracle/catalog.compact.json -> libraryVersion).
# See _shared.md before editing. Run: harbor run -c arms/cre8-mcp.yaml
job_name: cre8-a2ui-vs-mcp__cre8-mcp
jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 4

datasets:
  - path: tasks

agents:
  - name: claude-code
    model_name: claude-opus-5
    kwargs:
      # The arm under test must be the agent's only route to the catalog.
      # Without this the agent simply npm-packs @tmorrow/cre8-wc and reads
      # catalog.json, which makes all three arms the same experiment.
      # Identical in every arm, so it constrains the comparison equally.
      disallowed_tools: Bash,WebFetch,WebSearch,Task
    mcp_servers:
      - name: cre8
        transport: stdio
        command: npx
        args: ["-y", "@tmorrow/cre8-mcp@2.3.1"]
