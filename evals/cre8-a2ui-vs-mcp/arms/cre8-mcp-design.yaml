# Combined arm: cre8-mcp for component API facts, plus the cre8-design skill
# for judgment and token architecture. The configuration a real harness ships
# - the MCP alone answers what exists and what its props are, but nothing in
# it says which component a given job calls for.
#
# Run: harbor run -c arms/cre8-mcp-design.yaml
#
# Read against arms/cre8-mcp.yaml, which is identical minus the skill.
job_name: cre8-a2ui-vs-mcp__cre8-mcp-design
jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 4

datasets:
  - path: tasks
    # mcp-freecode-portfolio is scored by building and rendering real React
    # code, which needs Bash and an installed @tmorrow/cre8-react - neither of
    # which this arm's isolation allows. It runs from arms/cre8-mcp-freecode.yaml
    # instead.
    exclude_task_names:
      - mcp-freecode-portfolio

agents:
  - name: claude-code
    model_name: claude-opus-5
    kwargs:
      # The arm under test must be the agent's only route to the catalog.
      # Without this the agent simply npm-packs @tmorrow/cre8-wc and reads
      # catalog.json, which makes all three arms the same experiment.
      # Identical in every arm, so it constrains the comparison equally.
      disallowed_tools: Bash,WebFetch,WebSearch,Task
    skills:
      - .arm-inputs/cre8-design
    mcp_servers:
      - name: cre8
        transport: stdio
        command: npx
        args: ["-y", "@tmorrow/cre8-mcp@2.3.6"]
