# Skill arm, freecode variant: the cre8-a2ui skill's markdown, copied into
# the agent's skills dir, on the task whose deliverable is real React code.
# `prepare.sh` materialises .arm-inputs/cre8-a2ui first.
# See _shared.md before editing.
# Run: harbor run -c arms/a2ui-skill-freecode.yaml
#
# Read this arm's result with its mismatch in mind. The skill teaches how to
# author an A2UI JSON tree; this task wants TSX. Component, prop, enum and
# slot names carry across unchanged - which is the part being scored - but
# the format the skill spends its words on is not the format asked for. If
# it underperforms baseline here, "the skill is bad" is the wrong reading:
# the honest one is that knowledge shaped for one output format does not
# automatically transfer to another. That is a finding about how the
# knowledge is packaged, not about whether it is correct.
job_name: cre8-a2ui-vs-mcp__a2ui-skill-freecode
jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 4

datasets:
  - path: tasks
    task_names:
      - mcp-freecode-portfolio

agents:
  - name: claude-code
    model_name: claude-opus-5
    kwargs:
      # Allowed for parity with the other two freecode arms; see the long
      # note in arms/baseline-freecode.yaml for why isolation is neither
      # achievable nor meaningful on this task.
      disallowed_tools: WebFetch,WebSearch,Task
    skills:
      - .arm-inputs/cre8-a2ui
