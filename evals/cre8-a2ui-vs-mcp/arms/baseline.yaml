# Control arm: no CRE8 knowledge beyond what the model carries.
# See _shared.md before editing. Run: harbor run -c arms/baseline.yaml
job_name: cre8-a2ui-vs-mcp__baseline
jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 4

datasets:
  - path: tasks
    # mcp-freecode-portfolio is scored by building and rendering real React
    # code, which needs Bash and an installed @tmorrow/cre8-react - neither of
    # which this arm's isolation allows. It runs from arms/cre8-mcp-freecode.yaml
    # instead.
    exclude_task_names:
      - mcp-freecode-portfolio

agents:
  - name: claude-code
    model_name: claude-opus-5
    kwargs:
      # The arm under test must be the agent's only route to the catalog.
      # Without this the agent simply npm-packs @tmorrow/cre8-wc and reads
      # catalog.json, which makes all three arms the same experiment.
      # Identical in every arm, so it constrains the comparison equally.
      disallowed_tools: Bash,WebFetch,WebSearch,Task
