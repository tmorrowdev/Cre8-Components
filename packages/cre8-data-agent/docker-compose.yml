services:
  agent:
    build: .
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
      - ANTHROPIC_API_KEY=sentinel-not-a-real-key
      - ANTHROPIC_BASE_URL=http://proxy:8080/llm
      - CRE8_MCP_URL=http://proxy:8080/mcp
      - CLAUDE_MODEL=claude-opus-4-7
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - agent-net
      - frontend-net
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  proxy:
    build:
      context: ../cre8-agent-proxy
      dockerfile: Dockerfile
    env_file:
      - proxy.env
    environment:
      - CRE8_MCP_UPSTREAM=http://cre8-mcp:3001
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - agent-net
      - egress-net
    depends_on:
      cre8-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  cre8-mcp:
    build:
      context: ../..
      dockerfile: packages/cre8-mcp/Dockerfile
    env_file:
      - proxy.env
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - egress-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  agent-net:
    internal: true
  egress-net: {}
  frontend-net: {}
