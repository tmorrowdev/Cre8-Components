services:
  agent:
    build: .
    # No `ports:` here on purpose. Docker cannot publish a host port for a
    # container whose only network is internal:true (verified: the bind
    # succeeds but connections are refused). Host access comes from the
    # `gateway` service instead, so the agent keeps zero egress.
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
      - ANTHROPIC_API_KEY=sentinel-not-a-real-key
      - ANTHROPIC_BASE_URL=http://proxy:8080/llm
      - CRE8_MCP_URL=http://proxy:8080/mcp
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-fable-5-1}
      # Non-secret agent config, passed through so .env can drive it. Defaults
      # match the values the agent falls back to on its own.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - API_TOKEN=${API_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - agent-net
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Secret-free ingress. Sits between the host and the internal agent network
  # so the agent itself never needs a non-internal interface.
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
    networks:
      - agent-net
      - frontend-net
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  proxy:
    build:
      context: ../cre8-agent-proxy
      dockerfile: Dockerfile
    # Secrets are passed per-service from ./.env so each container receives only
    # what it actually reads. The proxy is the sole holder of ANTHROPIC_API_KEY.
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in packages/cre8-data-agent/.env}
      - CRE8_MCP_TOKEN=${CRE8_MCP_TOKEN:?set CRE8_MCP_TOKEN in packages/cre8-data-agent/.env}
      - CRE8_MCP_UPSTREAM=http://cre8-mcp:3001
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - agent-net
      - egress-net
    depends_on:
      cre8-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  cre8-mcp:
    build:
      context: ../..
      dockerfile: packages/cre8-mcp/Dockerfile
    # No ANTHROPIC_API_KEY here: cre8-mcp never reads it, so it never gets it.
    environment:
      - NODE_ENV=production
      - CRE8_MCP_TOKEN=${CRE8_MCP_TOKEN:?set CRE8_MCP_TOKEN in packages/cre8-data-agent/.env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - egress-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  # The untrusted zone. internal:true means no route to the internet — the proxy
  # is the only host the agent can reach. Do not attach the agent to any other
  # network: a single non-internal network restores full egress and voids the
  # entire sandbox.
  agent-net:
    internal: true
  egress-net: {}
  # Ingress only. The `gateway` service is the ONLY member — attaching the
  # agent here is what voided the sandbox before.
  frontend-net: {}
