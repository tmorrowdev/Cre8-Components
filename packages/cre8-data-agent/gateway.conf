# Ingress for the sandboxed agent.
#
# The agent sits on an internal:true network, which means Docker publishes no
# host port for it — that is the whole point, and it is why an earlier fix of
# attaching the agent to a second, non-internal network was wrong: it bought
# host access at the cost of full internet egress from the untrusted zone.
#
# This container buys the same host access without that cost. It holds no
# secrets and has exactly one upstream, so the agent can reach it but cannot
# route anything through it.
server {
    listen 8002;
    server_name _;

    # Docker's embedded DNS, re-resolved so an agent restart doesn't strand a
    # stale IP here.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # A CONSTANT upstream. Never derive this from the request — a
        # request-controlled proxy_pass would turn this container into the
        # egress hole the sandbox exists to prevent.
        set $agent_upstream http://agent:8002;
        proxy_pass $agent_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent streams SSE on /api/explore; buffering would stall it.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
